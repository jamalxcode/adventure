<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132b32">
<meta name="description" content="The Three Dragons: an original low-poly 3D fantasy adventure. Explore, solve puzzles, and fight or befriend three dragons.">
<title>The Three Dragons</title>
</head><body>
<main id="app">
 <canvas id="game" tabindex="0" aria-label="3D adventure world"></canvas>
 <aside id="hud" aria-live="off"></aside>
 <div id="prompt" aria-live="polite"></div>
 <div id="status" role="status" aria-live="polite">Loading The Three Dragons...</div>
 <nav class="game-controls" aria-label="Game controls">
  <button id="interact" type="button" aria-label="Interact (E)">USE <kbd>E</kbd></button>
  <button id="attack" type="button" aria-label="Swing sword (J)">SWORD <kbd>J</kbd></button>
  <button id="dodge" type="button" aria-label="Dodge (Space)">DODGE <kbd>␣</kbd></button>
  <button id="drop" type="button" aria-label="Drop item (Q)">DROP <kbd>Q</kbd></button>
  <button id="map" type="button" aria-label="Map (F)">MAP <kbd>F</kbd></button>
  <button id="help" type="button" aria-label="Help (H)">HELP <kbd>H</kbd></button>
 </nav>
 <div id="stick" aria-label="Movement stick"><div class="stick-dot"></div></div>
 <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Game menu"></div>
 <noscript>This browser game needs JavaScript and WebGL.</noscript>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
