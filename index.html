<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132b32">
<meta name="description" content="Adventure: The Lost Chalice, a playable low-poly 3D fantasy adventure prototype.">
<title>Adventure: The Lost Chalice</title>
</head><body>
<main id="app">
 <canvas id="game" tabindex="0" aria-label="Interactive 3D adventure world"></canvas>
 <aside id="hud" aria-live="off"></aside>
 <div id="status" role="status" aria-live="polite">Loading Adventure...</div>
 <nav class="game-controls" aria-label="Adventure controls">
  <button id="interact" type="button" aria-label="Interact with nearby item">INTERACT E</button>
  <button id="drop" type="button" aria-label="Drop carried object">DROP Q</button>
  <button id="map" type="button" aria-label="View kingdom map">MAP F</button>
  <button id="help" type="button" aria-label="View instructions">HELP H</button>
 </nav>
 <div id="stick" aria-label="Touch movement joystick"><div class="stick-dot"></div></div>
 <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Game menu"></div>
 <noscript>This browser game requires JavaScript and WebGL.</noscript>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
